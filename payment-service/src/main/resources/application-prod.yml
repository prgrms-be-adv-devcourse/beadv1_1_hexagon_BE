server:
  port: 8085

spring:
  application:
    name: payment-service

  jpa:
    open-in-view: false #Lazy Loading 사용 시 트랜잭션 종료를 명확하게 관리하기 위해 false
    hibernate:
      ddl-auto: validate # 음에는 create로 시작하여 엔티티 확인 후 validate로 변경
    properties:
      hibernate:
        show_sql: false
        format_sql: false #쿼리 로그를 보기 쉽게 포맷

  datasource:
    # TODO: 프로젝트 환경에 맞게 DB URL, Username, Password 수정 필요!!
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?rewriteBatchedStatements=true&connectionTimeout=3000&socketTimeout=10000
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

springdoc:
  swagger-ui:
    path: /api/payments/swagger-ui
  api-docs:
    path: /api/payments/v3/api-docs

payment:
  toss:
    widget-secret-key: test_gsk_docs_OaPz8L5KdmQXkzRz3y47BMw6
    confirm-url: https://api.tosspayments.com/v1/payments/confirm


eureka:
  client:
    serviceUrl:
      defaultZone: http://hexagon-discovery-service:8761/eureka/
  instance:
    instance-id: "${spring.application.name}:${server.port}:${random.uuid}"
    hostname: hexagon-payment-service