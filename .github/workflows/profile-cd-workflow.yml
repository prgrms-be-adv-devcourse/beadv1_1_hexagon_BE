name: profile-service ci/cd

on:
  push:
    branches:
      - test/ci-cd/119
    paths:
      - 'profile-service/**'

jobs:


  releasing:
    uses: ./.github/workflows/release-workflow.yml
    secrets: inherit
    permissions:
      contents: write
      attestations: write
      packages: write
      id-token: write
    with:
      service-name: hexagon-profile-service
      service-dir: ./profile-service
      file-name: Dockerfile_profile

  deploying:
    needs: releasing
    uses: ./.github/workflows/deploy-workflow.yml
    secrets: inherit
    with:
      service-name: hexagon-profile-service
      image-tag: ${{ needs.releasing.outputs.tag_name }}
