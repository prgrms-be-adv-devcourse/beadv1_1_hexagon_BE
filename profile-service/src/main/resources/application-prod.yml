eureka:
  instance:
    instance-id: "${spring.application.name}:${server.port}:${random.uuid}"
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/

springdoc:
  swagger-ui:
    path: /api/profiles/swagger-ui
  api-docs:
    path: /api/profiles/v3/api-docs