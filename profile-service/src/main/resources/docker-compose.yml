version: '3.8'

services:
  # 1. MySQL 컨테이너 (기존 사용하던 설정 기반)
  mysql:
    image: mysql:8.0
    container_name: profile-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: hexagon
    ports:
      - "3306:3306"
    volumes:
      # 로컬에 데이터 영속성을 유지하고 싶다면 주석 해제
      # - ./data/mysql:/var/lib/mysql
      - ./init/mysql:/docker-entrypoint-initdb.d # 초기 데이터 스크립트 위치 (선택 사항)

  # 2. ZooKeeper 컨테이너 (Kafka 필수)
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: profile-zookeeper
    restart: always
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  # 3. Kafka 컨테이너 (ZooKeeper에 의존)
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: profile-kafka
    restart: always
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181 # ZooKeeper 서비스 이름 사용
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,PLAINTEXT_INTERNAL://kafka:29092 # 외부 접근용, 내부 통신용
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1