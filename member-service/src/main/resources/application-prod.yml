server:
  port: 8084

spring:
  application:
    name: member-service

  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        show_sql: false
        format_sql: false

  datasource:
    url: jdbc:mysql://mysql:3306/${MYSQL_DATABASE}?rewriteBatchedStatements=true&connectionTimeout=3000&socketTimeout=10000
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER}
    password: ${MYSQL_PASSWORD}

  data:
    redis:
      host: redis
      port: 6379
      password: ${REDIS_PASSWORD}

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            scope: account_email
            authorization-grant-type: authorization_code
            redirect-uri: ${EC2_DOMAIN}/login/oauth2/code/kakao
            client-name: Kakao
            client-authentication-method: client_secret_post
          naver:
            client-id: ${NAVER_CLIENT_ID}
            client-secret: ${NAVER_CLIENT_SECRET}
            scope: email
            authorization-grant-type: authorization_code
            redirect-uri: ${EC2_DOMAIN}/login/oauth2/code/naver
            client-name: Naver
            client-authentication-method: client_secret_post
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: email
            redirect-uri: ${EC2_DOMAIN}/login/oauth2/code/google
            client-name: Google

        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id
          naver:
            authorization-uri: https://nid.naver.com/oauth2.0/authorize
            token-uri: https://nid.naver.com/oauth2.0/token
            user-info-uri: https://openapi.naver.com/v1/nid/me
            user-name-attribute: response

  kafka:
    bootstrap-servers: kafka:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      properties:
        delivery.timeout.ms: 120000
        linger.ms: 0
        request.timeout.ms: 30000
        enable.idempotence: true
        allow.auto.create.topics: true

    consumer:
      group-id: contract-service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: org.hexagon.core.*
        spring.json.use.type.headers: true
        allow.auto.create.topics: false

  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

mail:
  ttl:
    auth-code: 5
    verified: 30


kafka:
  topic:
    member:
      create-topic: member-create-topic
      update-topic: member-update-topic
      delete-topic: member-delete-topic
      delete-freelancer-role-topic: member-delete-freelancer-role-topic
      delete-client-role-topic: member-delete-client-role-topic
    profile:
      update-freelancer-role-topic: temp-topic
  config:
    topic-partitions: 1
    topic-replications: 1


jwt:
  access-token:
    secret: ${JWT_ACCESS_SECRET}
    ttl: ${JWT_ACCESS_TTL}
  refresh-token:
    secret: ${JWT_REFRESH_SECRET}
    ttl: ${JWT_REFRESH_TTL}

  claims:
    member-code: member-code
    is-sign: is-signed-up
    member-role: role

redirect-url:
  login:
    success: ${EC2_DOMAIN}/login/success
    need-signup: ${EC2_DOMAIN}/login/need-signup
    failure: ${EC2_DOMAIN}/login/fail

eureka:
  client:
    serviceUrl:
      defaultZone: http://eureka-server:8761/eureka/
  instance:
    instance-id: "${spring.application.name}:${server.port}:${random.uuid}"
    hostname: hexagon-member-service

springdoc:
  swagger-ui:
    path: /api/members/swagger-ui
  api-docs:
    path: /api/members/v3/api-docs

request:
  uri:
    ratings:
      info: "lb://PROFILE-SERVICE/api/ratings"