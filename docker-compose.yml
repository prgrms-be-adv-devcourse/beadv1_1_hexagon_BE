name: infra
services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka-infra
    ports:
      - "9092:9092"
    environment:
      - KAFKA_NODE_ID=1 # 브로커를 식별하는 고유 ID. KRaft 모드에서 브로커/컨트롤러를 구분하는 데 사용
      - CLUSTER_ID=ZWU1Y2JiNDctNDg3ZC4tNGY2Ny1iNzJh # Kafka 클러스터 ID. 새로운 클러스터 생성 시 생략 가능.
      - KAFKA_PROCESS_ROLES=controller,broker # 브로커, 컨트롤러 등 프로세스 역할 정의
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9091 # KRaft 모드 컨트롤러를 위한 quorum 설정. 노드ID@호스트:포트 형식으로 컨트롤러를 지정.
      - KAFKA_LISTENERS=PLAINTEXT://:9090,CONTROLLER://:9091,EXTERNAL://:9092 # Kafka가 수신할 리스너 정의. 포맷: 프로토콜://호스트:포트. 예: PLAINTEXT(클라이언트용), CONTROLLER(KRaft용 내부 통신), EXTERNAL(외부 접근)
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka:9090,EXTERNAL://localhost:9092 # 외부 클라이언트가 접속할 때 안내되는 주소
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT,PLAINTEXT:PLAINTEXT # 리스너별 프로토콜 정의
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER # 컨트롤러 역할을 수행하는 리스너 이름 지정. KRaft 모드에서 필수
      - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT # 브로커 간 통신 시 사용할 리스너 이름 지정.

  mysql:
    image: mysql:latest
    container_name: db-mysql
    ports:
      - "3306:3306"
    environment:
      - MYSQL_DATABASE=hexagon
      - MYSQL_ROOT_PASSWORD=1234
      - MYSQL_ALLOW_EMPTY_PASSWORD=true
      - TZ=Asia/Seoul
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      start_period: 30s # 초기화 시 컨테이너 구성이 덜 되었기에 헬스 체크 실패가 일어날 수 있어서 대기
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. Flyway 마이그레이션 (일회성 실행)
  migrate:
    image: flyway/flyway
    container_name: db-migration
    volumes: # 로컬의 SQL 폴더를 컨테이너 내부로 연결 (덮어쓰기)
      - ./data:/flyway/sql
    # 실행 명령어 (migrate)
    # 호스트 이름은 'localhost'가 아니라 위에서 정의한 서비스명 'mysql'을 써야 함
    command:
      - -url=jdbc:mysql://mysql:3306/hexagon?allowPublicKeyRetrieval=true&useSSL=false
      - -user=root
      - -password=1234
      - -connectRetries=60
      - -locations=filesystem:/flyway/sql
      - migrate

    # MySQL이 켜진 뒤에 실행하라
    depends_on:
      mysql:
        condition: service_healthy